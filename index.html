<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ดวง•ทรง — AI Aura, Physiognomy & Style Consultant (POC)</title>
  
  <!-- Google Fonts: Noto Serif Thai & Noto Sans Thai -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Thai:wght@500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- ดวง•ทรง Stylesheet -->
  <link rel="stylesheet" href="css/style.css?v=2.5">
</head>
<body>

  <!-- ===== TOPBAR ===== -->
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <div class="brand-mark"></div>
        <div>
          <div class="brand-name">ดวง•ทรง</div>
          <div class="brand-sub">AI Aura, Physiognomy & Style Consultant</div>
        </div>
      </div>
      
      <!-- Persona Switcher (รักษาข้อมูลผู้ใช้เดิมครบถ้วน 100%) -->
      <div class="persona-switch">
        <button class="persona-btn active" data-persona="female" onclick="setPersona('female')">
          <span class="persona-dot"></span> 01 / คุณพิมพ์พิชชา (สตรี)
        </button>
        <button class="persona-btn" data-persona="male" onclick="setPersona('male')">
          <span class="persona-dot"></span> 02 / คุณกฤติน (บุรุษ)
        </button>
      </div>
    </div>
  </header>

  <!-- ===== MAIN APPLICATION WRAPPER ===== -->
  <div class="app">

    <!-- 5-Step Horizontal Rail -->
    <div class="rail">
      <div class="rail-step active" data-step="1" onclick="goStep(1)">
        <span class="rn">ขั้นที่ 1</span>ข้อมูลดวงชะตา
      </div>
      <div class="rail-step" data-step="2" onclick="goStep(2)">
        <span class="rn">ขั้นที่ 2</span>โหงวเฮ้งใบหน้า
      </div>
      <div class="rail-step" data-step="3" onclick="goStep(3)">
        <span class="rn">ขั้นที่ 3</span>ฮวงจุ้ยสรีระ
      </div>
      <div class="rail-step" data-step="4" onclick="goStep(4)">
        <span class="rn">ขั้นที่ 4</span>พลังงานออร่า
      </div>
      <div class="rail-step" data-step="5" onclick="goStep(5)">
        <span class="rn">ขั้นที่ 5</span>แนะนำการแต่งกาย
      </div>
    </div>

    <!-- SCREEN 1: UPLOAD & INGESTION (TOR 2.2.1) -->
    <section class="screen show" id="screen-1">
      <div id="content-screen-1"></div>
    </section>

    <!-- SCREEN 2: FACE x โหงวเฮ้ง (TOR 2.2.2) -->
    <section class="screen" id="screen-2">
      <div id="content-screen-2"></div>
    </section>

    <!-- SCREEN 3: BODY x ฮวงจุ้ยสรีระ (TOR 2.2.4 & 3.2.1) -->
    <section class="screen" id="screen-3">
      <div id="content-screen-3"></div>
    </section>

    <!-- SCREEN 4: ASTROLOGY x AURA ENERGY (TOR 3.2.4) -->
    <section class="screen" id="screen-4">
      <div id="content-screen-4"></div>
    </section>

    <!-- SCREEN 5: FASHION RECOMMENDATION (TOR 4.2.1 & 4.2.2) -->
    <section class="screen" id="screen-5">
      <div id="content-screen-5"></div>
    </section>

  </div>

  <!-- Scripts -->
  <script src="js/mockData.js?v=2.5"></script>
  <script src="js/app.js?v=2.5"></script>
</body>
</html>
