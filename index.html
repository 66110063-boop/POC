<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aura & Astro-Styling AI | Proof of Concept</title>
  
  <!-- Tailwind CSS CDN for Utility Classes -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Hallmark Custom Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ========================================================================
       HALLMARK MASTHEAD & EDITORIAL CONTROLS
       ======================================================================== -->
  <header class="masthead">
    <div class="masthead-inner">
      
      <!-- Brand & DNA -->
      <div class="flex items-center gap-3">
        <a href="#" class="brand-wordmark">
          <span>ASTRAL ATELIER</span>
          <span class="brand-badge">POC 1.0</span>
        </a>
      </div>

      <!-- Persona Switcher (01 Female / 02 Male) -->
      <div class="persona-segment">
        <button class="persona-btn active" data-persona="female">
          01 / สตรี (พิมพ์พิชชา)
        </button>
        <button class="persona-btn" data-persona="male">
          02 / บุรุษ (กฤติน)
        </button>
      </div>

      <!-- Step Navigator -->
      <nav class="step-nav">
        <button class="step-nav-btn active" data-step="1">01 ข้อมูลดวง</button>
        <span class="text-neutral-600 text-xs">/</span>
        <button class="step-nav-btn" data-step="2">02 โหงวเฮ้ง</button>
        <span class="text-neutral-600 text-xs">/</span>
        <button class="step-nav-btn" data-step="3">03 ฮวงจุ้ยสรีระ</button>
        <span class="text-neutral-600 text-xs">/</span>
        <button class="step-nav-btn" data-step="4">04 พลังงานออร่า</button>
        <span class="text-neutral-600 text-xs">/</span>
        <button class="step-nav-btn" data-step="5">05 แฟชั่น 4 โอกาส</button>
      </nav>

    </div>
  </header>

  <!-- ========================================================================
       MAIN EDITORIAL STAGE (5 CORE SCREENS)
       ======================================================================== -->
  <main class="editorial-container">

    <!-- SCREEN 1: USER PROFILING (TOR 2.2.1) -->
    <section id="stage-1" class="screen-stage active-stage">
      <div id="content-stage-1">
        <!-- Rendered via app.js -->
      </div>
    </section>

    <!-- SCREEN 2: FACE ANALYSIS x PHYSIOGNOMY (TOR 2.2.2) -->
    <section id="stage-2" class="screen-stage">
      <div id="content-stage-2">
        <!-- Rendered via app.js -->
      </div>
    </section>

    <!-- SCREEN 3: BODY ANALYSIS x BONE FENG SHUI (TOR 2.2.4 & 3.2.1) -->
    <section id="stage-3" class="screen-stage">
      <div id="content-stage-3">
        <!-- Rendered via app.js -->
      </div>
    </section>

    <!-- SCREEN 4: ASTROLOGY x AURA & ENERGY PROFILE (TOR 3.2.4) -->
    <section id="stage-4" class="screen-stage">
      <div id="content-stage-4">
        <!-- Rendered via app.js -->
      </div>
    </section>

    <!-- SCREEN 5: FASHION RECOMMENDATION (TOR 4.2.1 & 4.2.2) -->
    <section id="stage-5" class="screen-stage">
      <div id="content-stage-5">
        <!-- Rendered via app.js -->
      </div>
    </section>

  </main>

  <!-- Scripts -->
  <script src="js/mockData.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
